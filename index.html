<div class="app" id="shiftScreen" style="display:none;">

    <h1>First Shift</h1>

    <p id="jobWelcome"></p>

    <h2>Your Stats</h2>

    <p>💰 Money: $<span id="money">0</span></p>
    <p>⭐ Experience: <span id="experience">0</span> XP</p>
    <p>⚡ Energy: <span id="energy">100</span>%</p>


    <div id="shiftEvent" style="display:none;">

        <h2>Your Task</h2>

        <p id="eventText"></p>

        <button class="choiceButton" id="choice1"></button>

        <button class="choiceButton" id="choice2"></button>

        <button class="choiceButton" id="choice3"></button>

    </div>


    <button id="startShiftButton">Start Shift</button>

    <p id="resultText"></p>

</div>
